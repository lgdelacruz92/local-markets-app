server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/listings {
        proxy_pass http://listings:3002;
        proxy_set_header Host $host;
    }

    location ^~ /api/listings/ {
        proxy_pass http://listings:3002;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://auth:3001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
